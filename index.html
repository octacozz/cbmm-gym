<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1122">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CBMM · Gimnasio</title>
<style>
:root{color-scheme:dark;--bg:#0a1122;--panel:#121c33;--panel2:#0f1930;--line:#22304f;--line2:#2e4068;--ink:#eef3fc;--muted:#9fb0cd;--faint:#6f80a3;--accent:#ff5c5c;--fill:#d42f34;--ok:#5fd29a;--warn:#f2b84b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));position:relative;z-index:1}
.wrap.wide{max-width:1180px}
.bg-logo{position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.bg-logo svg{width:min(78vw,540px);height:auto;color:var(--accent);opacity:.045}
.fox{color:var(--accent)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-weight:850;letter-spacing:.17em;font-size:12px}
.top .brand{display:flex;align-items:center;gap:8px}
.top .brand svg{width:22px;height:26px}
.top a,.top button.link{letter-spacing:.02em;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;background:none;border:0;padding:6px 0;display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:0;color:#fff;flex:none}
.badge{padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:10px;letter-spacing:.1em}
.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#17264b,#0f1a33);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.hero svg{position:absolute;z-index:-1;right:-6px;top:50%;transform:translateY(-50%);height:130%;width:auto;color:var(--accent);opacity:.24}
.eyebrow{margin:0;color:var(--accent);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:850}
.hero h1,.h1{font-size:clamp(36px,9vw,54px);letter-spacing:-.06em;line-height:.9;margin:12px 0 14px;font-weight:950;text-transform:uppercase}
.h1{margin:6px 0 10px}
.hero p:last-child{margin:0;font-weight:650;font-size:13px;color:var(--muted)}
.label{margin:0 0 8px;color:var(--muted);font-size:11px;letter-spacing:.13em;font-weight:780;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
.field input,.field select,.field textarea,.input{min-height:48px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--ink);font-size:16px;font-weight:500;letter-spacing:0;text-transform:none;width:100%}
textarea.input,.field textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:14px;border:0;background:var(--fill);color:#fff;font-weight:800;font-size:16px;text-decoration:none;width:100%}
.btn.ghost{background:var(--panel);border:1px solid var(--line2);color:var(--ink);font-weight:700}
.btn.small{min-height:42px;font-size:14px;width:auto;border-radius:11px}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;font-size:13px;min-height:32px}
.linkbtn.red{color:var(--accent)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
.msg.err{background:rgba(255,92,92,.12);border:1px solid #a8333a;color:#ffb3b3}
.msg.ok{background:rgba(95,210,154,.1);border:1px solid #2f6b52;color:var(--ok)}
.grid{display:grid;gap:7px;grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;padding:6px;font-size:13px;font-weight:750}
.opt[aria-pressed="true"]{color:#fff;background:var(--fill);border-color:var(--fill)}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:76px;padding:14px 16px;border-radius:15px;background:var(--panel);border:2px solid var(--line);text-align:left}
.choice b{display:block;font-size:20px;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.choice span{font-size:13px;color:var(--muted)}
.choice .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.choice[aria-checked="true"]{border-color:var(--fill);background:#1a1f38}
.choice[aria-checked="true"] .dot{border:7px solid var(--fill);background:#fff}
.session{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 6px}
.session h2{margin:0;font-size:24px;letter-spacing:-.045em}
.session span{font-size:12px;color:var(--accent);font-weight:750}
.bar{height:6px;border-radius:10px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar>span{display:block;height:100%;background:var(--fill);transition:width .2s}
.group-label{margin:16px 0 7px;color:var(--muted);font-size:11px;letter-spacing:.13em;font-weight:780;text-transform:uppercase}
.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:13px;margin-bottom:8px}
.card.done{border-color:#a8333a}
.card-top{display:flex;align-items:flex-start;gap:10px}
.num{flex:none;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.1em;padding-top:4px}
.card h3{margin:0;font-size:16px;line-height:1.25}
.target{margin:3px 0 0;color:var(--muted);font-size:12px}
.load{margin:5px 0 0;color:var(--accent);font-size:13px;font-weight:750}
.prev{margin:3px 0 0;color:var(--muted);font-size:12px;font-weight:600}
.lines{margin:8px 0 0;padding:0;list-style:none}
.lines li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding:5px 0}
.lines li span:last-child{color:var(--muted);white-space:nowrap}
.log{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{min-height:44px;min-width:44px;border:1px solid var(--line2);border-radius:9px;background:transparent;font-size:13px;font-weight:800}
.set[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.weight{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.weight input{width:72px;min-height:44px;padding:7px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--ink);font-size:16px;text-align:center}
.ramp{margin:8px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.note.pf{border-color:#a8333a}
.note.mine{border-color:#2f5c8f}
.note.mine small{color:#8fb4e0}
.timer{position:sticky;bottom:0;z-index:5;margin-top:14px;padding:8px 0 max(10px,env(safe-area-inset-bottom));background:var(--bg)}
.timer-inner{border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:5px;align-items:center;background:var(--panel2)}
.timer-inner.running{border-color:var(--accent)}
.timer-read{padding:0 5px;min-width:62px}
.timer-read .label{font-size:9px;margin:0}
#clock{display:block;font-variant-numeric:tabular-nums;font-weight:850;color:var(--accent);font-size:20px;line-height:1.15}
.tbtn{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:12px;font-weight:750;padding:4px}
#timer-status{color:var(--accent);font-weight:750;font-size:13px;min-height:18px;margin:6px 2px 0}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}
.tile b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px;font-weight:600}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px 16px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.list-row:first-child{border-top:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill.ok{color:var(--ok);background:rgba(95,210,154,.12)}
.pill.warn{color:var(--warn);background:rgba(242,184,75,.12)}
.pill.bad{color:#ff8a8a;background:rgba(255,92,92,.14)}
.effort{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.effort button{min-height:54px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:4px 2px}
.effort button b{display:block;font-size:16px}
.effort button span{display:block;font-size:10px;opacity:.85}
.effort button[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:#fff}
.pf-layout{display:flex;flex-wrap:wrap;gap:0;min-height:100vh}
.side{flex:1 1 210px;max-width:100%;background:var(--panel2);border-right:1px solid var(--line);padding:max(22px,env(safe-area-inset-top)) 14px 18px;display:flex;flex-direction:column;gap:4px}
.side .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.17em;margin:0 6px 16px}
.side .brand svg{width:24px;height:28px}
.side a{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 12px;border-radius:10px;color:#c9d4ea;font-size:14px;font-weight:650;text-decoration:none}
.side a[aria-current="page"]{background:var(--fill);color:#fff}
.side .count{padding:1px 7px;border-radius:999px;background:var(--fill);color:#fff;font-size:11px;font-weight:800}
.side a[aria-current="page"] .count{background:#fff;color:var(--fill)}
.pf-main{flex:999 1 560px;min-width:0;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 48px 20px}
.pf-main .h1{font-size:clamp(32px,5vw,46px)}
@media (max-width:820px){.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .brand{width:100%;margin-bottom:6px}.side a{min-height:38px;font-size:13px}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:750;background:var(--panel2)}
td small{display:block;color:var(--muted);font-size:12px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start}
.issue{padding:10px 12px;border-radius:10px;background:var(--bg);border-left:3px solid var(--warn);font-size:13px}
.issue.error{border-left-color:var(--accent)}
.issue b{display:block}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:140px;padding:20px;border-radius:16px;border:2px dashed var(--line2);background:var(--panel2);text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop b{font-size:17px}
.toast{position:fixed;left:50%;bottom:max(90px,calc(env(safe-area-inset-bottom) + 80px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.net{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--warn);color:#0a1122;font-weight:700;font-size:13px;text-align:center;padding:calc(6px + env(safe-area-inset-top)) 16px 6px}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(5,10,22,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease-out}
.sheet{position:relative;width:100%;max-width:420px;max-height:calc(100dvh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet h2{margin:0;font-size:30px;line-height:.95;letter-spacing:-.05em;font-weight:950;text-transform:uppercase}
.sheet p{margin:0}
.sheet .pending{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sheet .pending li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:650}
.sheet .pending li span{color:var(--accent);font-weight:800;white-space:nowrap}
.celebrate{text-align:center;overflow:hidden;border-color:#a8333a;background:linear-gradient(160deg,#3a1420,#17264b 70%)}
.celebrate .trophy{font-size:58px;line-height:1;margin:4px 0 0}
.celebrate h2{font-size:clamp(40px,12vw,56px)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:rgba(5,10,22,.45);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:22px;font-weight:900;letter-spacing:-.03em}
.stats span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:41;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r));opacity:.9}}
@keyframes pop{from{transform:scale(.9) translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.overlay,.sheet{animation:none}.confetti{display:none}}
.overlay.update{z-index:60}
.prog-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prog-head div{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.prog-head b{display:block;font-size:22px;font-weight:900;letter-spacing:-.03em}
.prog-head span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.ex-card h3{margin:0;font-size:16px;letter-spacing:-.01em}
.ex-card .kpi{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.ex-card .kpi b{font-size:26px;font-weight:900;letter-spacing:-.04em}
.delta{font-size:13px;font-weight:800}
.delta.up{color:var(--ok)} .delta.down{color:var(--warn)} .delta.flat{color:var(--muted)}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;transform:translate(-50%,-115%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:5px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.chart .tip small{display:block;font-weight:650;opacity:.75;font-size:10px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible+.dot,.chart .dot.on{stroke:var(--ink)}
.ex-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ex-table td,.ex-table th{padding:5px 0;border-top:1px solid var(--line);text-align:left}
.ex-table th{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
details.tbl summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:750;margin-top:8px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bubble{padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.bubble.pf{background:var(--fill);border-color:var(--fill);color:#fff}
.bubble small{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;opacity:.8;text-transform:uppercase}
</style>
</head>

<script>
// ===== Lector de la planilla "FORMATO PLAN FUERZA" =====
const WEEK_START = [2, 11, 20, 29]; // columnas C, L, U, AD (0 = A)
const COL = (i) => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

const strip = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const squash = (s) => String(s).replace(/\s+/g, ' ').trim();
const cleanVal = (s) => squash(s).replace(/[.,]+$/, '').trim();

// Abreviaturas y errores de tipeo frecuentes en las planillas
const WORDS = {
  BCO: 'banco', MANC: 'mancuerna', 'MANC.': 'mancuerna', '1BB': 'a un brazo', BB: 'brazo', '1PP': 'a una pierna',
  'C/': 'con', C: 'con', PTE: 'puente', LAT: 'lateral', POS: 'posición', PROF: 'profunda', 'O.H.': 'overhead', OH: 'overhead',
  FRON: 'frontal', SIMULT: 'simultáneo', ARROD: 'arrodillado', EXCETRIC: 'excéntrico', PERTURBACION: 'perturbación',
  PRENSION: 'prensión', BULGARAS: 'búlgaras', FRANCES: 'francés', TRICEPS: 'tríceps', BICEPS: 'bíceps',
  CUADRICEPS: 'cuádriceps', NORDICOS: 'nórdicos', ISQUIO: 'isquios', DIA: 'día', ATRAS: 'atrás', ANROLD: 'Arnold', '1ROD': 'una rodilla', DEFICIT: 'déficit', SIMULTANEO: 'simultáneo', 'FRON/LAT': 'frontal y lateral', 'L': 'en L', PLANCK: 'plank', BAND: 'banda', '+': '+',
  ARNOLD: 'Arnold', BICHOO: 'bicho', BARAA: 'barra', TRHUST: 'thrust', SOURRENDER: 'surrender', LADMINE: 'landmine',
  MENTON: 'mentón', PUÑOS: 'puños', PALLOF: 'Pallof', ZERCHER: 'Zercher', MEADOWS: 'Meadows', COPENHAGUE: 'Copenhague',
  SEE: 'see', SOW: 'saw', EM: 'en', T: 'thrust', PTAS: 'puntas', ESTOCADA: 'estocada', ESTOCADAS: 'estocadas', SILLON: 'sillón',
  'HIP': 'hip', 'C/DISCO': 'con disco', 'C/D': 'con disco', 'C/REMO': 'con remo', 'C/ PUÑOS': 'con puños', 'HOLD,': 'hold', 'HOLD.': 'hold',
  'EXCETRIC.': 'excéntrico', 'ARROD.': 'arrodillado', 'ALTERNADO.': 'alternado', 'HOLD': 'hold', TRAP: 'trap', BAR: 'bar'
};
function niceName(raw) {
  const words = squash(String(raw).replace(/\+/g, ' + ')).replace(/"/g, '').split(' ').filter(Boolean);
  const out = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i];
    const key = strip(w).toUpperCase();
    if (w === '1' && words[i + 1] && /^(BB|PP)$/i.test(words[i + 1])) { out.push(words[i + 1].toUpperCase() === 'BB' ? 'a un brazo' : 'a una pierna'); i++; continue; }
    if (WORDS[w] !== undefined) out.push(WORDS[w]);
    else if (WORDS[key] !== undefined) out.push(WORDS[key]);
    else if (key.startsWith('C/') && WORDS[key.slice(2)] !== undefined) out.push('con ' + WORDS[key.slice(2)]);
    else if (key.startsWith('C/')) out.push('con ' + w.slice(2).toLowerCase());
    else out.push(w.toLowerCase().replace(/[.,]+$/, ''));
  }
  let s = out.join(' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/^1\/2 /, 'medio ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const catalogKey = (name) => strip(name).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

function excelDate(serial) {
  const d = new Date(Math.round((serial - 25569) * 86400000));
  return { d: d.getUTCDate(), m: d.getUTCMonth() + 1 };
}
const isDateFmt = (z) => !!z && !/%/.test(z) && /[dmy]/i.test(z.replace(/"[^"]*"/g, ''));

function readPlan(XLSX, buffer, fileName) {
  const wb = XLSX.read(buffer, { type: 'array', cellNF: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const owner = {};
  for (const m of ws['!merges'] || []) {
    for (let r = m.s.r; r <= m.e.r; r++) for (let c = m.s.c; c <= m.e.c; c++) owner[r + ',' + c] = [m.s.r, m.s.c];
  }
  // Celda con su origen real (si está combinada, la de arriba a la izquierda)
  const cell = (r, c) => {
    const [rr, cc] = owner[r + ',' + c] || [r, c];
    const x = ws[XLSX.utils.encode_cell({ r: rr, c: cc })];
    if (!x || x.v === undefined || x.v === null || (typeof x.v === 'string' && !x.v.trim())) return null;
    return { v: x.v, t: x.t, z: x.z, r: rr, c: cc, ref: COL(cc) + (rr + 1), inherited: rr !== r };
  };
  const raw = (r, c) => { const x = cell(r, c); return x && !x.inherited ? x : null; };
  const first = (r, from, to) => { for (let c = from; c <= to; c++) { const x = cell(r, c); if (x) return x; } return null; };

  const plan = { file: fileName, group: '', days: [] };
  const issues = [];
  let day = null, block = null, pendingPrep = [];
  const addIssue = (level, where, text, ref) => issues.push({ level, ...where, text, ref });

  for (let r = range.s.r; r <= range.e.r; r++) {
    const a = raw(r, 0), b = raw(r, 1);
    const A = a ? squash(a.v).toUpperCase() : '';
    const B = b ? squash(b.v) : '';
    if (!A && !B) continue;
    if (A === 'PLAN DE FUERZA') continue;
    if (A.startsWith('PREPARACION')) {
      const g = first(r, 3, 12);
      if (g && !plan.group) plan.group = squash(g.v);
      if (B) pendingPrep.push(B);
      continue;
    }
    const dm = A.match(/^DIA\s*(\d+)/);
    if (dm) {
      day = { n: Number(dm[1]), prep: pendingPrep.slice(), blocks: [] };
      pendingPrep = [];
      plan.days.push(day);
      block = null;
      continue;
    }
    if (A === 'BLOQUES' || B.toUpperCase() === 'EJERCICIO') continue;
    if (/^REALIZAR MOVILIDAD/i.test(B) || /^ACTIVACION/i.test(B)) {
      (day && day.blocks.length === 0 && !pendingPrep.length ? day.prep : pendingPrep).push(B);
      continue;
    }
    if (!day || !B) continue;

    if (A) {
      const kind = /ESTABILIDAD/.test(A) ? 'core' : /CIRCUITO|AMRAP/.test(A) ? 'amrap' : 'bloque';
      block = { label: squash(a.v), kind, row: r, exercises: [], weeks: [] };
      day.blocks.push(block);
    } else if (!block) {
      block = { label: 'Ejercicios', kind: 'bloque', row: r, exercises: [], weeks: [] };
      day.blocks.push(block);
    }
    const isFirst = block.exercises.length === 0;
    const ex = { raw: B, name: niceName(B), row: r + 1, weeks: [] };
    ex.key = catalogKey(ex.name);
    for (let w = 0; w < 4; w++) {
      const s = WEEK_START[w];
      const where = { day: day.n, exercise: ex.name, week: w + 1 };
      const seriesCell = cell(r, s);
      const repsCell = first(r, s + 1, s + 4);
      const cargaCell = first(r, s + 5, s + 7);
      const restCell = cell(r, s + 8);
      const wk = {};
      // Series
      if (isFirst) block.weeks[w] = { series: seriesCell ? parseSeries(seriesCell.v) : null, rest: restCell ? parseRest(restCell.v) : null };
      const bw = block.weeks[w] || {};
      const ownSeries = seriesCell && !seriesCell.inherited ? parseSeries(seriesCell.v) : null;
      if (!isFirst && ownSeries && !ownSeries.ramp) {
        const blockLabel = bw.series ? bw.series.label : 'sin series';
        if (ownSeries.label !== blockLabel) addIssue('revisar', where, `Tiene un ${ownSeries.label} en la columna de series y el bloque hace ${blockLabel}. ¿Es a propósito o quedó suelto?`, seriesCell.ref);
      }
      wk.series = isFirst ? bw.series : (ownSeries || bw.series || null);
      wk.rest = !isFirst && restCell && !restCell.inherited ? parseRest(restCell.v) : (bw.rest || null);
      // Repeticiones (en series en escalera vienen en la misma celda que las series)
      if (wk.series && wk.series.ramp) wk.reps = { text: wk.series.ramp.map(g => `${g.sets}×${g.reps}`).join(' · '), list: wk.series.ramp.flatMap(g => Array(g.sets).fill(g.reps)) };
      else if (repsCell) {
        if (repsCell.t === 'n' && isDateFmt(repsCell.z) && repsCell.v > 59) {
          const { d, m } = excelDate(repsCell.v);
          addIssue('error', where, `Excel convirtió "${d}/${m}" en una fecha (${d} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][m - 1]}). Se lee como ${d}/${m}, por lado.`, repsCell.ref);
          wk.reps = parseReps(`${d}/${m}`);
        } else wk.reps = parseReps(repsCell.v);
      } else {
        wk.reps = null;
        addIssue('revisar', where, 'No tiene repeticiones cargadas para esta semana.', COL(s + 1) + (r + 1));
      }
      // Carga
      if (cargaCell) {
        const c = parseCarga(cargaCell);
        wk.carga = c;
        if (c.pct) for (const p of c.pct) {
          if (p > 100) addIssue('error', where, `La carga es ${fmtPct(p)} del máximo, más de lo que se puede levantar. Revisá el valor.`, cargaCell.ref);
          else if (p < 30 && !c.asNumber) addIssue('revisar', where, `La carga es ${fmtPct(p)} del máximo, muy baja comparada con el resto.`, cargaCell.ref);
        }
        if (c.asNumber) addIssue('error', where, `Dice "${cargaCell.v}" sin el signo %, en otras semanas está en %. Se lee como ${fmtPct(c.pct[0])}.`, cargaCell.ref);
      } else wk.carga = null;
      ex.weeks.push(wk);
    }
    block.exercises.push(ex);
  }
  return { plan, issues };
}

const fmtPct = (p) => (Math.round(p * 10) / 10).toString().replace('.', ',') + '%';

function parseSeries(v) {
  if (typeof v === 'number') return { count: v, label: String(v) };
  const s = squash(v).toUpperCase();
  const ramp = [...s.matchAll(/(\d+)\s*\*\s*(\d+)/g)];
  if (ramp.length >= 2) {
    const groups = ramp.map(m => ({ sets: Number(m[1]), reps: Number(m[2]) }));
    const count = groups.reduce((t, g) => t + g.sets, 0);
    return { count, label: String(count), ramp: groups };
  }
  let m = s.match(/^(\d+)\s*\+\s*(\d+)$/);
  if (m) return { count: Number(m[1]) + Number(m[2]), label: `${m[1]}+${m[2]}`, extra: Number(m[2]) };
  m = s.match(/(\d+)\s*MIN/);
  if (m) return { minutes: Number(m[1]), label: `${m[1]} min` };
  m = s.match(/^(\d+)\.?$/);
  if (m) return { count: Number(m[1]), label: m[1] };
  return { label: cleanVal(v) };
}

function parseRest(v) {
  const s = squash(v).toUpperCase();
  if (/NO\s*HAY/.test(s)) return { seconds: 0, label: 'Sin pausa' };
  let m = s.match(/^(\d+(?:[.,]\d+)?)\s*[´'`’]/);
  if (m) { const sec = Math.round(parseFloat(m[1].replace(',', '.')) * 60); return { seconds: sec, label: sec % 60 ? `${sec} s` : `${sec / 60} min` }; }
  m = s.match(/^(\d+)\s*(S|SEG|")?$/);
  if (m) return { seconds: Number(m[1]), label: `${m[1]} s` };
  return { label: cleanVal(v) };
}

function parseReps(v) {
  if (typeof v === 'number') return { text: `${v}`, n: v, unit: 'reps' };
  let s = cleanVal(v);
  const U = s.toUpperCase();
  let m;
  if (U === 'AMRAP') return { text: 'máximo de reps', unit: 'amrap' };
  if ((m = U.match(/^(\d+)\s*"\s*\/\s*(\d+)\s*"$/))) return { text: `${m[1]} s por lado`, unit: 's' };
  if ((m = U.match(/^(\d+)\s*\/\s*(\d+)[-.]?$/))) return { text: `${m[1]} por lado`, n: Number(m[1]), unit: 'reps', perSide: true };
  if ((m = U.match(/^(\d+)\s*"\.?$/))) return { text: `${m[1]} s`, unit: 's' };
  if ((m = U.match(/^(\d+)\s*\*\s*(\d+)\s*"$/))) return { text: `${m[1]} × ${m[2]} s`, unit: 's' };
  if ((m = U.match(/^(\d+)\s*\*\s*(\d+)$/))) return { text: `${m[1]} × ${m[2]}`, unit: 'reps' };
  if ((m = U.match(/^(\d+)\s*PASOS$/))) return { text: `${m[1]} pasos`, unit: 'pasos' };
  if ((m = U.match(/^(\d+)\s*MTS?$/))) return { text: `${m[1]} m`, unit: 'm' };
  if ((m = U.match(/^(\d+)\s*TOTAL$/))) return { text: `${m[1]} en total`, unit: 'reps' };
  if ((m = U.match(/^(\d+)$/))) return { text: m[1], n: Number(m[1]), unit: 'reps' };
  if (/^\d+(\s*-\s*\d+){2,}$/.test(U) && !/^7-7-7$/.test(U)) { const list = U.split('-').map(x => Number(x.trim())); return { text: list.join(' · '), list, unit: 'reps' }; }
  if (/^7-7-7$/.test(U)) return { text: '7 + 7 + 7 (21)', unit: 'reps' };
  if ((m = U.match(/^(\d+)\s*\+\s*(\d+)$/))) return { text: `${m[1]} + ${m[2]}`, parts: [Number(m[1]), Number(m[2])], unit: 'reps' };
  return { text: s.toLowerCase().replace('fallo', 'al fallo').replace(/\s*\+\s*/g, ' + '), unit: 'reps' };
}

function parseCarga(x) {
  const v = x.v;
  if (typeof v === 'number') {
    if (x.z && /%/.test(x.z)) return { pct: [v * 100], text: fmtPct(v * 100) };
    if (v <= 1.5) return { pct: [v * 100], text: fmtPct(v * 100) };
    if (v <= 100) return { pct: [v], text: fmtPct(v), asNumber: true };
    return { text: String(v) };
  }
  const s = squash(v).toUpperCase();
  let m;
  if ((m = s.match(/^(\d+)\s*A\s*(\d+)\s*%?$/))) return { pct: [Number(m[1]), Number(m[2])], range: true, text: `${m[1]} a ${m[2]}%` };
  if ((m = s.match(/^(\d+)\s*\+\s*(\d+)\s*%?$/))) return { pct: [Number(m[1]), Number(m[2])], split: true, text: `${m[1]}% + ${m[2]}%` };
  if ((m = s.match(/^(\d+)\s*%$/))) return { pct: [Number(m[1])], text: `${m[1]}%` };
  if (/NO\s*HAY/.test(s)) return null;
  const notes = { HOLD: 'sostené', SLOW: 'lento', 'MAX.VEL': 'máxima velocidad', 'MAX. VEL': 'máxima velocidad' };
  return { note: notes[s] || cleanVal(v).toLowerCase().replace('kg', ' kg').replace(/\s+/g, ' ') };
}

if (typeof module !== 'undefined') module.exports = { readPlan, parseReps, parseSeries, parseCarga, parseRest, niceName };

</script>

// ===================== Configuración =====================
const SUPABASE_URL = 'https://cfcguumuaeiikhikuddl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Py9j5O7u3V12P5huAThaVw_NUKI_91v';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

// ===================== Utilidades =====================
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const kgFmt = (n) => (Math.round(n * 100) / 100).toString().replace('.', ',');
const initials = (n) => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
const FOX = '<svg viewBox="0 0 2835 3415" aria-hidden="true"><use href="#fox"/></svg>';
const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fmtDate = (s) => s ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T00:00:00' : s).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) : '—';
function ago(s) {
  if (!s) return 'nunca';
  const d = Math.floor((todayStart() - new Date(new Date(s).setHours(0, 0, 0, 0))) / 86400000);
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2800); }
function fail(e) { console.error(e); toast(e?.message ? 'Error: ' + e.message : 'Algo falló. Probá de nuevo.'); }
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ===================== Estado =====================
const S = {
  user: null, perfil: null, grupos: [],
  plan: null, bloques: [], items: [], week: 0, day: 0,
  sesion: null, series: {}, prev: {}, prevNota: {}, maximos: {}, comentarios: [],
  effort: 2, asPlayer: LS.get('as-player', false),
  pf: { tab: 'inicio' }
};
const isPF = () => S.perfil && ['pf', 'admin'].includes(S.perfil.rol) && !S.asPlayer;

// ===================== Router =====================
function go(view) { if (location.hash !== '#' + view) location.hash = view; else render(); }
window.addEventListener('hashchange', render);
function view() { return (location.hash || '#').slice(1); }

async function boot() {
  const { data } = await db.auth.getSession();
  S.user = data.session?.user || null;
  if (S.user) await loadPerfil();
  render();
  flush();
}
db.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') { S.user = session?.user || null; go('nueva-clave'); return; }
  if (event === 'SIGNED_OUT') { Object.assign(S, { user: null, perfil: null, plan: null }); go('login'); }
});

async function loadPerfil() {
  try {
    const [{ data: p, error }, { data: g, error: e2 }] = await Promise.all([
      db.from('perfiles').select('*').eq('id', S.user.id).single(),
      db.from('grupos').select('*').order('orden')
    ]);
    if (error) throw error; if (e2) throw e2;
    S.perfil = p; S.grupos = g || []; LS.set('perfil-cache', { p, g: S.grupos });
  } catch (e) {
    const c = LS.get('perfil-cache', null);
    if (c && c.p?.id === S.user.id) { S.perfil = c.p; S.grupos = c.g; } else throw e;
  }
}
const grupoName = (id) => S.grupos.find((g) => g.id === id)?.nombre || 'Sin grupo';

function render() {
  const v = view();
  if (v === 'nueva-clave') return renderNewPassword();
  if (!S.user) {
    if (v === 'registro') return renderSignup();
    if (v === 'olvide') return renderForgot();
    return renderLogin();
  }
  if (!S.perfil) return;
  if (isPF() && !v.startsWith('pf') && v !== 'perfil' && v !== 'progreso') return go('pf');
  if (v.startsWith('pf') && isPF()) return renderPF(v);
  if (v === 'perfil') return renderPerfil();
  if (v === 'progreso') return renderProgreso();
  if (!S.perfil.grupo_id || v === 'grupo') return renderGroupPick();
  if (v === 'cierre') return renderCierre();
  return renderEntreno();
}

// ===================== Plan del jugador =====================
async function loadPlan(grupoId) {
  try {
    const { data: plan, error } = await db.from('planes').select('*').eq('grupo_id', grupoId).eq('estado', 'activo').maybeSingle();
    if (error) throw error;
    let r = { plan: null, bloques: [], items: [] };
    if (plan) {
      const { data: bloques, error: e2 } = await db.from('bloques').select('*').eq('plan_id', plan.id).order('dia').order('orden');
      if (e2) throw e2;
      const ids = (bloques || []).map((b) => b.id);
      const { data: items, error: e3 } = ids.length ? await db.from('items').select('*').in('bloque_id', ids).order('orden') : { data: [] };
      if (e3) throw e3;
      r = { plan, bloques: bloques || [], items: items || [] };
    }
    LS.set('plan-cache-' + grupoId, r);
    return r;
  } catch (e) {
    const c = LS.get('plan-cache-' + grupoId, null);
    if (c) return c;
    throw e;
  }
}
function currentWeek(plan) {
  if (!plan?.inicio) return 0;
  const diff = Math.floor((todayStart() - new Date(plan.inicio + 'T00:00:00')) / (7 * 86400000));
  return Math.max(0, Math.min(plan.semanas - 1, diff));
}
async function ensurePlan() {
  if (S.plan && S.plan.grupo_id === S.perfil.grupo_id) return;
  const r = await loadPlan(S.perfil.grupo_id);
  Object.assign(S, r);
  S.week = Math.min(LS.get('semana-' + (r.plan?.id || 0), currentWeek(r.plan)), (r.plan?.semanas || 1) - 1);
  S.day = Math.min(LS.get('dia-' + (r.plan?.id || 0), 0), (r.plan?.dias || 1) - 1);
  try {
    const { data: mx, error } = await db.from('maximos').select('*').eq('jugador_id', S.user.id);
    if (error) throw error;
    S.maximos = Object.fromEntries((mx || []).map((m) => [m.ejercicio, Number(m.kg)]));
    LS.set('max-cache', S.maximos);
  } catch { S.maximos = LS.get('max-cache', {}); }
}

// ---------- Sesión del día, con copia local para cuando no hay señal ----------
const keyOf = () => S.plan.id + '-' + (S.week + 1) + '-' + (S.day + 1);
const sesIds = () => LS.get('ses-ids', {});
async function loadSession() {
  S.sesion = null; S.series = {}; S.prev = {}; S.prevNota = {}; S.comentarios = [];
  if (!S.plan) return;
  const key = keyOf();
  try {
    const { data: ses, error } = await db.from('sesiones').select('*').eq('jugador_id', S.user.id).eq('plan_id', S.plan.id).eq('semana', S.week + 1).eq('dia', S.day + 1).maybeSingle();
    if (error) throw error;
    S.sesion = ses || null;
    if (ses) {
      const ids = sesIds(); ids[key] = ses.id; LS.set('ses-ids', ids);
      const { data: ser, error: e2 } = await db.from('series').select('*').eq('sesion_id', ses.id);
      if (e2) throw e2;
      for (const r of ser || []) S.series[r.item_id + ':' + r.numero] = r;
    }
    // Peso y nota de semanas anteriores (fila numero 0 = peso usado y nota del jugador)
    const { data: prevSes } = await db.from('sesiones').select('id,semana').eq('jugador_id', S.user.id).eq('plan_id', S.plan.id).eq('dia', S.day + 1).lt('semana', S.week + 1).order('semana', { ascending: false });
    if (prevSes?.length) {
      const { data: pw } = await db.from('series').select('sesion_id,item_id,kg,nota').in('sesion_id', prevSes.map((s) => s.id)).eq('numero', 0).or('kg.not.is.null,nota.not.is.null');
      for (const s of prevSes) for (const r of (pw || []).filter((x) => x.sesion_id === s.id)) {
        if (r.kg != null && !S.prev[r.item_id]) S.prev[r.item_id] = { kg: r.kg, week: s.semana };
        if (r.nota && !S.prevNota[r.item_id]) S.prevNota[r.item_id] = { texto: r.nota, week: s.semana };
      }
    }
    const { data: com } = await db.from('comentarios').select('*').eq('jugador_id', S.user.id).order('creado_en');
    S.comentarios = com || [];
    LS.set('ses-cache-' + key, { sesion: S.sesion, series: S.series, prev: S.prev, prevNota: S.prevNota, comentarios: S.comentarios });
  } catch (e) {
    const c = LS.get('ses-cache-' + key, null);
    if (c) Object.assign(S, { sesion: c.sesion, series: c.series, prev: c.prev, prevNota: c.prevNota || {}, comentarios: c.comentarios || [] });
  }
  for (const op of queue()) if (op.key === key && op.uid === S.user.id) applyLocal(op);
}
function applyLocal(op) {
  if (op.t === 'set') S.series[op.item + ':' + op.n] = { ...(S.series[op.item + ':' + op.n] || {}), hecha: op.hecha, numero: op.n };
  if (op.t === 'kg') S.series[op.item + ':0'] = { ...(S.series[op.item + ':0'] || {}), kg: op.kg, numero: 0 };
  if (op.t === 'nota') S.series[op.item + ':0'] = { ...(S.series[op.item + ':0'] || {}), nota: op.nota, numero: 0 };
  if (op.t === 'comment') S.comentarios.push({ id: 'p' + op.id, jugador_id: S.user.id, autor_id: S.user.id, item_id: op.item, texto: op.texto, pendiente: true, key: op.key });
}

// ---------- Cola de cambios: todo lo que marca el jugador pasa por acá ----------
const queue = () => LS.get('cola-v1', []);
function saveQueue(q) { LS.set('cola-v1', q); updateNet(); }
function enqueue(op) {
  Object.assign(op, { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), uid: S.user.id, key: keyOf(), plan_id: S.plan.id, semana: S.week + 1, dia: S.day + 1 });
  const q = queue();
  const i = q.findIndex((x) => x.uid === op.uid && x.key === op.key && x.t === op.t && ((op.t === 'set' && x.item === op.item && x.n === op.n) || (op.t === 'kg' && x.item === op.item) || (op.t === 'nota' && x.item === op.item) || op.t === 'cierre'));
  if (i >= 0) q[i] = op; else q.push(op);
  saveQueue(q);
  applyLocal(op);
  LS.set('ses-cache-' + op.key, { sesion: S.sesion, series: S.series, prev: S.prev, prevNota: S.prevNota, comentarios: S.comentarios.filter((c) => !c.pendiente) });
  flush();
}
const netErr = (e) => !navigator.onLine || /fetch|network|load failed|timeout/i.test(e?.message || String(e));
async function sesIdFor(op) {
  const ids = sesIds(); if (ids[op.key]) return ids[op.key];
  const { data, error } = await db.from('sesiones').upsert({ jugador_id: op.uid, plan_id: op.plan_id, semana: op.semana, dia: op.dia }, { onConflict: 'jugador_id,plan_id,semana,dia' }).select().single();
  if (error) throw error;
  ids[op.key] = data.id; LS.set('ses-ids', ids); return data.id;
}
let flushing = false;
async function flush() {
  if (flushing || !S.user || !navigator.onLine) return updateNet();
  flushing = true;
  try {
    for (;;) {
      const op = queue().find((x) => x.uid === S.user.id);
      if (!op) break;
      try {
        const sid = await sesIdFor(op);
        let r;
        if (op.t === 'set') r = await db.from('series').upsert({ sesion_id: sid, item_id: op.item, numero: op.n, hecha: op.hecha });
        else if (op.t === 'kg') r = await db.from('series').upsert({ sesion_id: sid, item_id: op.item, numero: 0, hecha: false, kg: op.kg });
        else if (op.t === 'nota') r = await db.from('series').upsert({ sesion_id: sid, item_id: op.item, numero: 0, hecha: false, nota: op.nota });
        else if (op.t === 'comment') r = await db.from('comentarios').insert({ jugador_id: op.uid, autor_id: op.uid, item_id: op.item || null, sesion_id: sid, texto: op.texto });
        else if (op.t === 'cierre') r = await db.from('sesiones').update({ terminada: op.terminada, esfuerzo: op.esfuerzo, nota: op.nota }).eq('id', sid);
        if (r?.error) throw r.error;
      } catch (e) {
        if (netErr(e)) break; // sin señal: queda en la cola y se reintenta
        console.error('Cambio descartado', op, e);
      }
      saveQueue(queue().filter((x) => x.id !== op.id));
    }
  } finally { flushing = false; updateNet(); }
}
function updateNet() {
  const el = $('#net'); if (!el) return;
  const n = S.user ? queue().filter((o) => o.uid === S.user.id).length : 0;
  const pl = n === 1 ? '' : 's';
  if (!navigator.onLine) { el.hidden = false; el.textContent = n ? `Sin señal · ${n} cambio${pl} guardado${pl} en el teléfono. Se suben solos cuando vuelva la conexión.` : 'Sin señal · podés seguir marcando, se guarda en el teléfono.'; }
  else if (n) { el.hidden = false; el.textContent = `Subiendo ${n} cambio${pl}…`; }
  else el.hidden = true;
}
window.addEventListener('online', () => { updateNet(); flush(); });
window.addEventListener('offline', updateNet);
setInterval(() => { if (navigator.onLine && queue().length) flush(); }, 20000);

// Series de un ejercicio en una semana: [{reps, pct, pcts, extra}]
function setsFor(w) {
  if (!w) return [];
  const c = w.carga, pct = c && c.pct ? c.pct : null, s = w.series;
  if (s && s.ramp) {
    const n = s.ramp.length, out = [];
    s.ramp.forEach((g, gi) => { const p = pct ? (c.range ? pct[0] + (pct[1] - pct[0]) * (n === 1 ? 1 : gi / (n - 1)) : pct[0]) : null; for (let k = 0; k < g.sets; k++) out.push({ reps: g.reps + ' reps', pct: p }); });
    return out;
  }
  if (s && s.minutes) return [{ reps: s.minutes + ' min', amrap: true }];
  const count = s && s.count ? s.count : 1, out = [];
  for (let k = 0; k < count; k++) {
    let reps = w.reps ? w.reps.text : '';
    if (w.reps?.list) reps = (w.reps.list[k] ?? w.reps.list.at(-1)) + ' reps';
    const extra = s && s.extra && k >= count - s.extra;
    if (c && c.split) out.push({ reps, pcts: pct, extra });
    else out.push({ reps, pct: pct ? (c.range ? pct[1] : pct[0]) : null, extra });
  }
  return out;
}
const roundKg = (kg) => Math.round(kg / (LS.get('paso', 1) || 1)) * (LS.get('paso', 1) || 1);
function targetLine(blk, w) {
  const s = w.series, r = w.reps, parts = [];
  if (s?.ramp) parts.push(`${s.count} series · ${s.ramp.flatMap((g) => Array(g.sets).fill(g.reps)).join(' · ')} reps`);
  else if (s?.minutes) parts.push(`${s.minutes} min, máximo de vueltas`);
  else { if (s?.label) parts.push(`${s.label} series`); if (r) parts.push(r.unit === 'reps' && r.n != null && !r.perSide ? r.n + ' reps' : r.text); }
  if (w.rest) parts.push(w.rest.seconds ? w.rest.label + ' descanso' : 'sin descanso');
  if (w.carga?.note) parts.push(w.carga.note);
  return parts.join(' · ');
}
function loadLine(item, w) {
  const c = w.carga; if (!c?.pct) return '';
  const mx = S.maximos[maxKey(item.nombre)];
  const pctTxt = c.split ? `${c.pct[0]}% + ${c.pct[1]}%` : c.range ? `${c.pct[0]} a ${c.pct[1]}%` : `${Math.round(c.pct[0])}%`;
  if (!mx) return `${pctTxt} de tu máximo · <button class="linkbtn red" data-act="max" data-key="${esc(maxKey(item.nombre))}" data-name="${esc(item.nombre)}">cargar máximo</button>`;
  const kg = (q) => kgFmt(roundKg(mx * q / 100));
  const val = c.split ? `${kg(c.pct[0])} + ${kg(c.pct[1])} kg` : c.range ? `${kg(c.pct[0])} → ${kg(c.pct[1])} kg` : `${kg(c.pct[0])} kg`;
  return `${pctTxt} → ${val} <button class="linkbtn" data-act="max" data-key="${esc(maxKey(item.nombre))}" data-name="${esc(item.nombre)}">máx. ${kgFmt(mx)}</button>`;
}
const maxKey = (name) => catalogKey(name);

let renderToken = 0;
async function renderEntreno() {
  const token = ++renderToken;
  try { await ensurePlan(); await loadSession(); } catch (e) { return fail(e); }
  if (token !== renderToken) return;
  const p = S.plan;
  const head = `<div class="top"><span class="brand">${FOX}CBMM</span>
    <span class="row" style="gap:12px">${['pf', 'admin'].includes(S.perfil.rol) ? '<button class="link" data-act="back-pf">Vista PF</button>' : ''}<a href="#perfil">Mi perfil<span class="avatar">${esc(initials(S.perfil.nombre))}</span></a></span></div>`;
  if (!p) {

      const key = its[0].id;
      let d = 0; const btns = Array.from({ length: n }, (_, k) => { const on = !!S.series[key + ':' + (k + 1)]?.hecha; if (on) d++; return `<button class="set" data-act="set" data-item="${key}" data-n="${k + 1}" data-rest="0" aria-pressed="${on}" aria-label="Vuelta ${k + 1}">${on ? '✓' : k + 1}</button>`; }).join('');
      total += n; done += d;
      const lab = kind === 'amrap' ? `${w0.series?.minutes || ''} min · la mayor cantidad de vueltas` : `${w0.series?.label || n} vueltas · sin pausa entre ejercicios`;
      cards += `<article class="card${d === n ? ' done' : ''}"><div class="card-top"><span class="num">${String(num).padStart(2, '0')}</span><div style="flex:1;min-width:0"><h3>${kind === 'amrap' ? 'Circuito AMRAP' : 'Circuito de estabilidad'}</h3><p class="target">${esc(lab)}</p><ul class="lines">${lines}</ul></div></div><div class="log"><div class="sets">${btns}</div></div>${commentBlock(key, kind === 'amrap' ? 'Circuito AMRAP' : 'Circuito de estabilidad')}</article>`;
      continue;
    }
    for (const it of its) {

      const sets = setsFor(w);
      const rest = w.rest?.seconds || 0;
      let d = 0;
      const btns = sets.map((s, k) => { const on = !!S.series[it.id + ':' + (k + 1)]?.hecha; if (on) d++; return `<button class="set" data-act="set" data-item="${it.id}" data-n="${k + 1}" data-rest="${rest}" data-name="${esc(it.nombre)}" aria-pressed="${on}" aria-label="Serie ${k + 1} de ${esc(it.nombre)}">${on ? '✓' : k + 1}</button>`; }).join('');
      total += sets.length; done += d;
      const ll = loadLine(it, w);
      const mx = S.maximos[maxKey(it.nombre)];
      const ramp = w.series?.ramp && mx && w.carga?.pct ? `<p class="ramp">${sets.map((s, k) => `S${k + 1} ${esc(s.reps.replace(' reps', ''))}×${kgFmt(roundKg(mx * s.pct / 100))}`).join(' · ')} kg</p>` : '';
      const pv = (S.prev[it.id] ? `<p class="prev">Semana ${S.prev[it.id].week}: ${kgFmt(S.prev[it.id].kg)} kg</p>` : '') + (S.prevNota[it.id] ? `<p class="note mine"><small>Tu nota · semana ${S.prevNota[it.id].week}</small>${esc(S.prevNota[it.id].texto)}</p>` : '');

        <div class="log"><div class="sets">${btns}</div><label class="weight"><input inputmode="decimal" data-act="kg" data-item="${it.id}" value="${wv != null ? kgFmt(wv) : ''}" placeholder="—" aria-label="Peso usado en ${esc(it.nombre)}"> kg</label></div>
        ${noteBlock(it.id, it.nombre)}${commentBlock(it.id, it.nombre)}</article>`;
    }
  }
  const pctDone = total ? Math.round(done / total * 100) : 0;
  const unread = S.comentarios.filter((c) => c.autor_id !== S.user.id && !c.respuesta_vista).length;
  $('#app').innerHTML = `<div class="wrap">${head}
    <div class="hero">${FOX}<p class="eyebrow">${esc(grupoName(p.grupo_id))} · ${esc(p.nombre)}</p><h1>Plan de<br>fuerza</h1><p>${p.semanas} semanas · ${p.dias} días por semana</p></div>
    <p class="label" style="margin-top:22px">Semana</p>
    <div class="grid" style="grid-template-columns:repeat(${Math.min(p.semanas, 6)},minmax(0,1fr))">${Array.from({ length: p.semanas }, (_, i) => `<button class="opt" data-act="week" data-i="${i}" aria-pressed="${i === S.week}">Semana ${i + 1}</button>`).join('')}</div>
    <p class="label" style="margin-top:15px">Entrenamiento</p>
    <div class="grid" style="grid-template-columns:repeat(${Math.min(p.dias, 7)},minmax(0,1fr))">${Array.from({ length: p.dias }, (_, i) => `<button class="opt" data-act="day" data-i="${i}" aria-pressed="${i === S.day}">Día ${i + 1}</button>`).join('')}</div>
    <div class="session"><h2>Semana ${S.week + 1} · Día ${S.day + 1}</h2><span>${total && done === total ? 'Día completo ✓' : `${done} / ${total} series`}</span></div>
    <div class="bar" aria-hidden="true"><span style="width:${pctDone}%"></span></div>
    <p class="small muted" style="margin:0 0 6px">Movilidad básica y activación antes de empezar. Al marcar una serie, el descanso arranca solo.</p>
    ${cards || '<p class="muted">Este día no tiene ejercicios cargados.</p>'}
    <button class="btn" data-act="finish" style="margin-top:12px">Terminar el día</button>
    ${timerHTML()}
  </div>`;
  bindTimer();
}

function pendingSets() {

}

function noteBlock(itemId, name) {

// Temporizador (igual que la app original)
let deadline = 0, tick, audio;
function timerHTML() {
  return `<div class="timer" aria-label="Temporizador de descanso"><div class="timer-inner" id="timer-inner"><div class="timer-read"><div class="label">Descanso</div><output id="clock">0:00</output></div>
    <button class="tbtn" data-sec="60">60 s</button><button class="tbtn" data-sec="90">90 s</button><button class="tbtn" data-sec="120">2 min</button><button class="tbtn" id="stop" style="color:var(--muted)">Parar</button></div><div id="timer-status" role="status"></div></div>`;
}
function bindTimer() { document.querySelectorAll('[data-sec]').forEach((b) => b.onclick = () => startTimer(Number(b.dataset.sec))); $('#stop').onclick = stopTimer; updateTimer(); }
function unlockAudio() { try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch {} }
function beep() { if (!audio) return; try { [0, .3, .6].forEach((o) => { const t = audio.currentTime + o, osc = audio.createOscillator(), g = audio.createGain(); osc.frequency.value = 880; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .2); osc.connect(g).connect(audio.destination); osc.start(t); osc.stop(t + .22); }); } catch {} }
function updateTimer() {
  const clock = $('#clock'); if (!clock) return;
  const sec = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  clock.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  $('#timer-inner').classList.toggle('running', sec > 0);
  if (sec === 0 && deadline) { clearInterval(tick); deadline = 0; $('#timer-status').textContent = 'Descanso terminado. ¡A la próxima serie!'; try { navigator.vibrate?.([250, 120, 250, 120, 250]); } catch {} beep(); }
}
let timerLabel = '';
function startTimer(sec, name) { unlockAudio(); clearInterval(tick); deadline = Date.now() + sec * 1000; timerLabel = name || ''; const st = $('#timer-status'); if (st) st.textContent = name ? 'Descansando · ' + name : ''; updateTimer(); tick = setInterval(updateTimer, 250); }
function stopTimer() { deadline = 0; clearInterval(tick); const st = $('#timer-status'); if (st) st.textContent = ''; updateTimer(); }
document.addEventListener('visibilitychange', () => { if (deadline) updateTimer(); });

// Acciones del jugador

// ===================== Cierre del día =====================
async function renderCierre() {
  try { await ensurePlan(); await loadSession(); } catch (e) { return fail(e); }
  if (!S.plan) return go('entreno');
  const its = S.items.filter((i) => S.bloques.find((b) => b.id === i.bloque_id && b.dia === S.day + 1));
  const done = Object.values(S.series).filter((r) => r.hecha && r.numero > 0).length;
  let total = 0;
  for (const b of S.bloques.filter((x) => x.dia === S.day + 1)) {
    const bi = its.filter((i) => i.bloque_id === b.id); if (!bi.length) continue;
    if (b.tipo === 'circuito' || b.tipo === 'amrap') total += b.tipo === 'amrap' ? 1 : ((bi[0].semanas[S.week] || {}).series?.count || 1);

  const labels = ['Muy fácil', 'Fácil', 'Justo', 'Duro', 'Al límite'];
  const e0 = S.sesion?.esfuerzo ? S.sesion.esfuerzo - 1 : S.effort;
  $('#app').innerHTML = `<div class="wrap stack">
    <div class="top"><span class="brand">${FOX}CBMM</span><a href="#entreno">Volver al día</a></div>
    <div class="hero" style="border-color:#a8333a;background:linear-gradient(135deg,#3a1420,#17264b)">${FOX}<p class="eyebrow">Semana ${S.week + 1} · Día ${S.day + 1} · ${esc(grupoName(S.plan.grupo_id))}</p><h1>Día<br>${full ? 'completo' : 'terminado'}</h1><p>${full ? `${done} series marcadas · todas ✓` : `${done} de ${total} series marcadas`}</p></div>
    ${loads ? `<div class="panel"><p class="label">Tus cargas de hoy</p>${loads}</div>` : ''}
    <div><p class="label">¿Qué tan duro fue?</p><div class="effort" role="radiogroup" aria-label="Esfuerzo">${labels.map((l, i) => `<button type="button" role="radio" data-e="${i}" aria-pressed="${i === e0}" aria-checked="${i === e0}"><b>${i + 1}</b><span>${l}</span></button>`).join('')}</div></div>
    <label class="field">Algo para el PF (opcional)<textarea id="nota" maxlength="1000" placeholder="Ej.: en la búlgara me molestó la rodilla">${esc(S.sesion?.nota || '')}</textarea></label>
    <button class="btn" id="send">${S.sesion?.terminada ? 'Actualizar' : 'Enviar al PF'}</button>

async function renderProgreso() {
  $('#app').innerHTML = `<div class="wrap"><div class="loading">Cargando tu progreso…</div></div>`;
  let series = [];
  try {
    const { data: ses, error } = await db.from('sesiones').select('id,plan_id,semana,dia,empezada').eq('jugador_id', S.user.id);
    if (error) throw error;
    const sesById = Object.fromEntries((ses || []).map((x) => [x.id, x]));
    const ids = Object.keys(sesById).map(Number);
    let rows = [];
    for (let i = 0; i < ids.length; i += 150) {
      const { data, error: e2 } = await db.from('series').select('sesion_id,item_id,kg').in('sesion_id', ids.slice(i, i + 150)).eq('numero', 0).not('kg', 'is', null);
      if (e2) throw e2; rows = rows.concat(data || []);
    }
    const itemIds = [...new Set(rows.map((r) => r.item_id))];
    const names = {};
    for (let i = 0; i < itemIds.length; i += 150) {
      const { data } = await db.from('items').select('id,nombre').in('id', itemIds.slice(i, i + 150));
      for (const it of data || []) names[it.id] = it.nombre;
    }
    const byEx = new Map();
    for (const r of rows) {
      const sx = sesById[r.sesion_id]; const nombre = names[r.item_id]; if (!sx || !nombre || !(Number(r.kg) > 0)) continue;
      const key = maxKey(nombre);
      if (!byEx.has(key)) byEx.set(key, { nombre, pts: [] });
      byEx.get(key).pts.push({ kg: Number(r.kg), fecha: sx.empezada, semana: sx.semana, plan: sx.plan_id, dia: sx.dia });
    }
    series = [...byEx.values()].map((e) => {
      e.pts.sort((a, b) => (a.fecha && b.fecha ? new Date(a.fecha) - new Date(b.fecha) : (a.plan - b.plan) || (a.semana - b.semana) || (a.dia - b.dia)));
      const first = e.pts[0].kg, last = e.pts[e.pts.length - 1].kg;
      return { ...e, first, last, best: Math.max(...e.pts.map((p) => p.kg)), diff: last - first };
    }).sort((a, b) => b.pts.length - a.pts.length || a.nombre.localeCompare(b.nombre));
  } catch (e) { fail(e); }
  const up = series.filter((x) => x.pts.length > 1 && x.diff > 0).length;
  const top = series.filter((x) => x.pts.length > 1 && x.first > 0).sort((a, b) => b.diff / b.first - a.diff / a.first)[0];
  const totalPts = series.reduce((t, x) => t + x.pts.length, 0);
  $('#app').innerHTML = `<div class="wrap stack">
    <div class="top"><span class="brand">${FOX}CBMM</span><a href="#perfil">Volver al perfil</a></div>
    <div><p class="eyebrow">${esc(S.perfil.nombre || '')}</p><h1 class="h1">Mi progreso</h1><p class="small muted" style="margin:0">Los kilos que anotaste en cada ejercicio, entrenamiento por entrenamiento.</p></div>
    ${series.length ? `<div class="prog-head">
      <div><b>${series.length}</b><span>Ejercicios</span></div>
      <div><b>${up}</b><span>Subiste peso</span></div>
      <div><b>${top && top.diff > 0 ? '+' + Math.round(top.diff / top.first * 100) + '%' : totalPts}</b><span>${top && top.diff > 0 ? 'Mejor suba' : 'Registros'}</span></div>
    </div>
    ${top && top.diff > 0 ? `<p class="small" style="margin:-4px 0 0;color:var(--muted)">Mejor suba: <b style="color:var(--ink)">${esc(top.nombre)}</b>, de ${kgFmt(top.first)} a ${kgFmt(top.last)} kg.</p>` : ''}
    ${series.map((x, i) => exCard(x, i)).join('')}` : `<div class="panel" style="text-align:center;padding:34px 18px"><svg viewBox="0 0 48 28" width="64" height="38" aria-hidden="true" style="opacity:.6"><polyline points="2,24 14,18 26,20 38,9 46,4" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 style="margin:10px 0 6px;font-size:19px">Todavía no hay datos</h2><p class="small muted" style="margin:0">Cuando entrenes, anotá los kilos en el casillero <b>kg</b> de cada ejercicio. Acá vas a ver cómo suben semana a semana.</p></div>`}
  </div>`;
  bindCharts();
}
function exCard(x, i) {
  const cls = x.pts.length < 2 ? 'flat' : x.diff > 0 ? 'up' : x.diff < 0 ? 'down' : 'flat';
  const delta = x.pts.length < 2 ? 'un solo registro' : x.diff > 0 ? `↑ +${kgFmt(x.diff)} kg desde el inicio` : x.diff < 0 ? `↓ ${kgFmt(x.diff)} kg desde el inicio` : '= igual que al inicio';
  const lab = (p) => (p.fecha ? fmtDate(p.fecha) : 'Sem ' + p.semana);
  return `<section class="panel ex-card">
    <h3>${esc(x.nombre)}</h3>
    <div class="kpi"><b>${kgFmt(x.last)} kg</b><span class="delta ${cls}">${delta}</span></div>
    ${x.pts.length > 1 ? chartSVG(x, i) : '<p class="small muted" style="margin:6px 0 0">Anotá el peso otra semana para ver la línea.</p>'}
    <details class="tbl"><summary>Ver como tabla</summary><table class="ex-table"><thead><tr><th>Fecha</th><th>Semana</th><th style="text-align:right">Kilos</th></tr></thead><tbody>${x.pts.map((p) => `<tr><td>${lab(p)}</td><td>Sem ${p.semana} · Día ${p.dia}</td><td style="text-align:right;font-weight:800">${kgFmt(p.kg)} kg</td></tr>`).join('')}</tbody></table></details>
  </section>`;
}
function niceTicks(min, max) {
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const raw = (max - min) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + 1e-9; v += step) t.push(Math.round(v * 100) / 100);
  return t;
}
function chartSVG(x, idx) {
  const W = 320, H = 150, L = 34, R = 14, T = 14, B = 24;
  const ks = x.pts.map((p) => p.kg), ticks = niceTicks(Math.min(...ks), Math.max(...ks));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], n = x.pts.length;
  const X = (i) => L + (n === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (n - 1));
  const Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  const lab = (p) => (p.fecha ? fmtDate(p.fecha) : 'Sem ' + p.semana);
  const pts = x.pts.map((p, i) => [X(i), Y(p.kg)]);
  const grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${kgFmt(t)}</text>`).join('');
  const last = pts[n - 1];
  const step = Math.max(1, Math.ceil(n / 5));
  const xl = x.pts.map((p, i) => (i % step === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < step) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="10" fill="var(--faint)">${lab(p)}</text>` : '').join('');
  const hitW = Math.max(18, (W - L - R) / Math.max(1, n - 1));
  return `<div class="chart" data-chart="${idx}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.nombre)}: de ${kgFmt(x.first)} a ${kgFmt(x.last)} kg en ${n} entrenamientos">
      ${grid}${xl}
      <polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<g><rect class="hit" x="${p[0] - hitW / 2}" y="${T - 6}" width="${hitW}" height="${H - T - B + 12}" tabindex="0" data-i="${i}" data-kg="${kgFmt(x.pts[i].kg)}" data-l="${esc(lab(x.pts[i]))} · Sem ${x.pts[i].semana}" aria-label="${esc(lab(x.pts[i]))}: ${kgFmt(x.pts[i].kg)} kg"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 4.5 : 3.5}" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" pointer-events="none"/></g>`).join('')}
      <text x="${Math.min(last[0], W - R)}" y="${last[1] - 10}" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink)">${kgFmt(x.last)} kg</text>
    </svg><div class="tip" hidden></div></div>`;
}
function bindCharts() {
  document.querySelectorAll('.chart').forEach((c) => {
    const tip = c.querySelector('.tip'), svg = c.querySelector('svg');
    const show = (h) => {
      c.querySelectorAll('.dot.on').forEach((d) => d.classList.remove('on'));
      const dot = h.nextElementSibling; dot.classList.add('on');
      const r = svg.getBoundingClientRect(), k = r.width / svg.viewBox.baseVal.width;
      tip.innerHTML = `${h.dataset.kg} kg<small>${h.dataset.l}</small>`;
      tip.style.left = Math.min(Math.max(dot.cx.baseVal.value * k, 40), r.width - 40) + 'px';
      tip.style.top = dot.cy.baseVal.value * k + 'px';
      tip.hidden = false;
    };
    const hide = () => { tip.hidden = true; c.querySelectorAll('.dot.on').forEach((d) => d.classList.remove('on')); };
    c.querySelectorAll('.hit').forEach((h) => { h.addEventListener('pointerenter', () => show(h)); h.addEventListener('click', () => show(h)); h.addEventListener('focus', () => show(h)); h.addEventListener('blur', hide); });
    c.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hide(); });
  });
}

async function pfData() {
  const [per, ses, com, pla] = await Promise.all([
    db.from('perfiles').select('*').order('nombre'),
    db.from('sesiones').select('id,jugador_id,empezada,terminada,esfuerzo,semana,dia,plan_id').gte('empezada', new Date(Date.now() - 28 * 86400000).toISOString()).order('empezada', { ascending: false }),
    db.from('comentarios').select('*').order('creado_en', { ascending: false }).limit(200),
    db.from('planes').select('*').neq('estado', 'archivado').order('creado_en', { ascending: false })
  ]);
  for (const r of [per, ses, com, pla]) if (r.error) throw r.error;
  const perfiles = per.data, byId = Object.fromEntries(perfiles.map((p) => [p.id, p]));
  const comentarios = com.data;
  const answered = new Set(comentarios.filter((c) => c.respuesta_a).map((c) => c.respuesta_a));

  pfUnread = pending.length;
  return { perfiles, byId, sesiones: ses.data, comentarios, pending, planes: pla.data };
}

function prescription(w) {
  const s = w.series; if (!s && !w.reps) return '—';
  if (s?.ramp) return s.ramp.map((g) => `${g.sets}×${g.reps}`).join(' ');
  if (s?.minutes) return `${s.minutes} min · ${w.reps?.text || ''}`;
  return `${s ? s.label + ' × ' : ''}${w.reps?.text || '?'}`;
}

          <div class="row between"><h2 style="margin:0;font-size:17px">Cómo quedó leído</h2><div class="row" style="gap:5px">${parsed.plan.days.map((d, i) => `<button class="opt" style="padding:0 12px" data-pd="${i}" aria-pressed="${i === pday}">Día ${d.n}</button>`).join('')}</div></div>

      </div>`);
    document.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { gid = Number(b.dataset.g); LS.set('pf-grupo', gid); draw(); });
    document.querySelectorAll('[data-pd]').forEach((b) => b.onclick = () => { pday = Number(b.dataset.pd); draw(); });
    $('#start').onchange = (e) => (start = e.target.value);
    const drop = $('#drop');
    ['dragenter', 'dragover'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) readXlsx(f); });
    $('#file').onchange = (e) => { const f = e.target.files[0]; if (f) readXlsx(f); };
    $('#publish').onclick = publish;
  };
  async function readXlsx(f) {
    if (!window.XLSX) return toast('Cargando el lector de Excel, probá en un segundo');
    try {
      const res = readPlan(XLSX, await f.arrayBuffer(), f.name);
      if (!res.plan.days.length) { parsed = null; draw(); return showErr('No encontré los días ("DIA 1", "DIA 2"…). ¿Es la planilla del plan de fuerza?'); }
      parsed = res; fileName = f.name; pday = 0;
      const g = S.grupos.find((x) => (res.plan.group || '').toUpperCase().replace('FOWARDS', 'FORWARDS').includes(x.nombre.toUpperCase()));
      if (g) gid = g.id;
      draw();
    } catch (e) { parsed = null; draw(); showErr('No pude leer el archivo. Tiene que ser un Excel .xlsx.'); }
  }
  async function publish() {
    const btn = $('#publish'); btn.disabled = true; btn.textContent = 'Publicando…';
    try {
      const p = parsed.plan;
      const old = D.planes.filter((x) => x.grupo_id === gid && x.estado === 'activo');
      const name = 'Plan de ' + grupoName(gid) + ' · ' + (start ? new Date(start + 'T00:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) : '');
      const { data: plan, error: e1 } = await db.from('planes').insert({ grupo_id: gid, nombre: name, inicio: start || null, semanas: 4, dias: p.days.length, estado: 'borrador', origen: 'excel', archivo: fileName, creado_por: S.user.id }).select().single();
      if (e1) throw e1;
      for (const d of p.days) {
        const rows = d.blocks.map((b, bi) => ({ plan_id: plan.id, dia: d.n, orden: bi, titulo: b.kind === 'core' ? 'Estabilidad central' : b.kind === 'amrap' ? 'Circuito AMRAP' : (b.label.match(/BLOQUE\s*\d+/i) || [b.label])[0].replace(/BLOQUE/i, 'Bloque'), tipo: b.kind === 'core' ? 'circuito' : b.kind === 'amrap' ? 'amrap' : b.exercises.length > 1 ? 'superserie' : 'bloque', semanas: b.weeks }));
        const { data: bl, error: e2 } = await db.from('bloques').insert(rows).select();
        if (e2) throw e2;
        const items = [];
        d.blocks.forEach((b, bi) => { const blk = bl.find((x) => x.orden === bi); b.exercises.forEach((e, ei) => items.push({ bloque_id: blk.id, orden: ei, nombre: e.name, semanas: e.weeks })); });
        const { error: e3 } = await db.from('items').insert(items);
        if (e3) throw e3;
      }
      // Recién cuando está todo cargado: se archiva el plan anterior y se activa el nuevo
      if (old.length) { const { error } = await db.from('planes').update({ estado: 'archivado' }).in('id', old.map((o) => o.id)); if (error) throw error; }
      const { error: e4 } = await db.from('planes').update({ estado: 'activo' }).eq('id', plan.id);
      if (e4) throw e4;
      toast('Publicado para ' + grupoName(gid) + ' ✓');
      S.plan = null; go('pf-rutinas');
    } catch (e) { btn.disabled = false; btn.textContent = 'Publicar para ' + grupoName(gid); fail(e); }
  }
  draw();
}
function grouped(issues) {
  const m = new Map();
  for (const i of issues) { const k = [i.level, i.day, i.exercise, i.text].join('|'); if (!m.has(k)) m.set(k, { ...i, weeks: [], refs: [] }); m.get(k).weeks.push(i.week); m.get(k).refs.push(i.ref); }
  return [...m.values()].sort((a, b) => (a.level === 'error' ? 0 : 1) - (b.level === 'error' ? 0 : 1) || a.day - b.day);
}
