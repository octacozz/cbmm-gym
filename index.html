const BLOCK_TYPES = [['bloque', 'Normal'], ['superserie', 'Superserie'], ['circuito', 'Circuito'], ['amrap', 'AMRAP']];
function newBlock(dia, n, semanas) { return { dia, tipo: 'bloque', titulo: 'Bloque ' + n, descanso: '2 min', series: Array(semanas).fill('3'), items: [newItem(semanas)] }; }
function newItem(semanas) { return { nombre: '', reps: Array(semanas).fill(''), pct: Array(semanas).fill('') }; }
function emptyEditor(gid) {
  const monday = (() => { const d = new Date(); const k = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + (d.getDay() === 1 ? 0 : k)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
  return { gid, nombre: 'Plan de ' + grupoName(gid), inicio: monday, semanas: 4, dias: 4, dia: 0, bloques: [1, 2, 3, 4].map((d) => newBlock(d, 1, 4)) };
}
function seriesText(s) { if (!s) return ''; if (s.ramp) return s.ramp.map((g) => g.sets + '*' + g.reps).join(' '); if (s.minutes) return s.minutes + ' min'; return s.label || ''; }
function cargaText(c) { if (!c) return ''; if (c.pct) return c.range ? c.pct[0] + '-' + c.pct[1] : c.split ? c.pct[0] + '+' + c.pct[1] : String(Math.round(c.pct[0] * 10) / 10); return c.note || ''; }
function planToEditor(r, gid) {
  if (!r.plan) return emptyEditor(gid);
  const n = r.plan.semanas;
  return {
    gid, nombre: r.plan.nombre, inicio: r.plan.inicio || '', semanas: n, dias: r.plan.dias, dia: 0,
    bloques: r.bloques.map((b) => {
      const its = r.items.filter((i) => i.bloque_id === b.id);
      const w = (k) => b.semanas?.[k] || its[0]?.semanas?.[k] || {};
      return {
        dia: b.dia, tipo: b.tipo, titulo: b.titulo, descanso: w(0).rest ? (w(0).rest.seconds === 0 ? 'sin pausa' : w(0).rest.label) : '',
        series: Array.from({ length: n }, (_, k) => seriesText(w(k).series)),
        items: its.map((i) => ({ nombre: i.nombre, reps: Array.from({ length: n }, (_, k) => i.semanas[k]?.series?.ramp ? '' : (i.semanas[k]?.reps?.text || '')), pct: Array.from({ length: n }, (_, k) => cargaText(i.semanas[k]?.carga)) }))
      };
    })
  };
}
function cargaFrom(txt) {
  const t = String(txt || '').trim().replace('%', '').replace(',', '.');
  if (!t) return null;
  let m;
  if ((m = t.match(/^(\d+(?:\.\d+)?)\s*(?:-|–|a)\s*(\d+(?:\.\d+)?)$/i))) return { pct: [Number(m[1]), Number(m[2])], range: true, text: `${m[1]} a ${m[2]}%` };
  if ((m = t.match(/^(\d+(?:\.\d+)?)\s*\+\s*(\d+(?:\.\d+)?)$/))) return { pct: [Number(m[1]), Number(m[2])], split: true, text: `${m[1]}% + ${m[2]}%` };
  if ((m = t.match(/^(\d+(?:\.\d+)?)$/))) return { pct: [Number(m[1])], text: `${m[1]}%` };
  return { note: String(txt).trim() };
}
function restFrom(txt) {
  const t = String(txt || '').trim().toLowerCase();
  if (!t) return null;
  if (/sin|no hay|^0/.test(t)) return { seconds: 0, label: 'Sin pausa' };
  let m;
  if ((m = t.match(/^(\d+(?:[.,]\d+)?)\s*(min|m|´|')/))) { const sec = Math.round(parseFloat(m[1].replace(',', '.')) * 60); return { seconds: sec, label: sec % 60 ? sec + ' s' : sec / 60 + ' min' }; }
  if ((m = t.match(/^(\d+)\s*(s|seg|")?$/))) return { seconds: Number(m[1]), label: m[1] + ' s' };
  return { label: txt };
}
function editorToRows(ed) {
  return ed.bloques.filter((b) => b.items.some((i) => i.nombre.trim())).map((b) => {
    const rest = restFrom(b.descanso);
    const series = b.series.map((x) => (String(x).trim() ? parseSeries(b.tipo === 'amrap' && /^\d+$/.test(String(x).trim()) ? x + ' min' : String(x)) : null));
    return {
      dia: b.dia, tipo: b.tipo, titulo: b.titulo.trim() || 'Bloque',
      semanas: series.map((se) => ({ series: se, rest })),
      items: b.items.filter((i) => i.nombre.trim()).map((i) => ({
        nombre: i.nombre.trim(),
        semanas: series.map((se, k) => ({ series: se, rest, reps: String(i.reps[k] || '').trim() ? parseReps(String(i.reps[k]).trim()) : (se?.ramp ? { text: se.ramp.map((g) => `${g.sets}×${g.reps}`).join(' · ') } : null), carga: cargaFrom(i.pct[k]) }))
      }))
    };
  });
}

async function pfCrear(D) {
  let ed = LS.get('editor-v1', null) || emptyEditor(LS.get('pf-grupo', S.grupos[0]?.id));
  const names = [...new Set((await db.from('items').select('nombre').limit(1000)).data?.map((i) => i.nombre) || [])].sort();
  const save = () => LS.set('editor-v1', ed);
  const resize = () => {
    const n = ed.semanas;
    const fit = (a, fill) => Array.from({ length: n }, (_, k) => a[k] ?? (a.length ? a[a.length - 1] : fill));
    ed.bloques.forEach((b) => { b.series = fit(b.series, '3'); b.items.forEach((i) => { i.reps = fit(i.reps, ''); i.pct = fit(i.pct, ''); }); });
    for (let d = 1; d <= ed.dias; d++) if (!ed.bloques.some((b) => b.dia === d)) ed.bloques.push(newBlock(d, 1, n));
    ed.bloques = ed.bloques.filter((b) => b.dia <= ed.dias);
    ed.dia = Math.min(ed.dia, ed.dias - 1);
  };
  resize();
  const draw = () => {
    save();
    const dayBlocks = ed.bloques.map((b, bi) => ({ b, bi })).filter((x) => x.b.dia === ed.dia + 1);
    const wk = Array.from({ length: ed.semanas }, (_, k) => k);
    const cell = 'min-height:34px;padding:4px 6px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px;width:100%';
    pfShell('pf-crear', `
      <datalist id="ej-list">${names.map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
      <div class="row between" style="align-items:flex-end"><div style="flex:1;min-width:260px"><p class="eyebrow">Crear rutina · se guarda sola como borrador</p>
        <input data-f="nombre" value="${esc(ed.nombre)}" aria-label="Nombre de la rutina" style="width:100%;max-width:560px;border:0;border-bottom:2px dashed var(--line2);background:transparent;color:var(--ink);font:900 34px system-ui;letter-spacing:-.04em;padding:2px 0"></div>
        <div class="row"><button class="btn small ghost" id="ed-reset">Empezar de cero</button><button class="btn small" id="ed-publish">Publicar para ${esc(grupoName(ed.gid))}</button></div></div>
      <div class="panel row" style="gap:14px">
        <span class="row" style="gap:6px"><span class="label" style="margin:0">Grupo</span>${S.grupos.map((g) => `<button class="opt" style="padding:0 12px" data-gid="${g.id}" aria-pressed="${g.id === ed.gid}">${esc(g.nombre)}</button>`).join('')}</span>
        <label class="row small muted" style="gap:6px">Semanas <select data-f="semanas" class="input" style="width:auto;min-height:38px">${[1, 2, 3, 4, 5, 6, 8].map((n) => `<option${n === ed.semanas ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="row small muted" style="gap:6px">Días <select data-f="dias" class="input" style="width:auto;min-height:38px">${[1, 2, 3, 4, 5, 6].map((n) => `<option${n === ed.dias ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="row small muted" style="gap:6px">Empieza <input type="date" data-f="inicio" value="${esc(ed.inicio)}" class="input" style="width:auto;min-height:38px"></label>
      </div>
      <div class="row between"><div class="row" style="gap:6px" role="tablist">${Array.from({ length: ed.dias }, (_, d) => `<button class="opt" style="padding:0 16px" role="tab" data-day="${d}" aria-pressed="${d === ed.dia}">Día ${d + 1}</button>`).join('')}</div>
        <div class="row"><button class="btn small ghost" id="ed-copy">Copiar semana 1 a todas</button><button class="btn small ghost" id="ed-prog">Subir 5% por semana</button></div></div>
      <p class="small muted" style="margin:0">En <b>Series</b> podés poner 3, 3+1, una escalera como <b>1*10 1*8 2*6</b> o, en AMRAP, los minutos. En <b>%</b> poné 75, un rango como 60-80 o dos cargas como 85+55. Los kilos de cada jugador se calculan solos con su máximo.</p>
      ${dayBlocks.map(({ b, bi }) => `<article class="panel">
        <div class="row between" style="margin-bottom:8px"><div class="row" style="gap:8px"><input data-b="${bi}" data-k="titulo" value="${esc(b.titulo)}" aria-label="Nombre del bloque" style="${cell};width:160px;font-weight:800;text-transform:uppercase">
          ${BLOCK_TYPES.map(([v, l]) => `<button class="opt" style="padding:0 10px;min-height:34px;font-size:12px" data-bt="${bi}" data-v="${v}" aria-pressed="${b.tipo === v}">${l}</button>`).join('')}</div>
          <div class="row" style="gap:8px"><label class="small muted row" style="gap:6px">Descanso <input data-b="${bi}" data-k="descanso" value="${esc(b.descanso)}" placeholder="2 min" style="${cell};width:90px"></label><button class="linkbtn red" data-delb="${bi}">Quitar bloque</button></div></div>
        <div style="overflow-x:auto"><table style="min-width:${260 + ed.semanas * 140}px"><thead><tr><th style="width:240px">Ejercicio</th>${wk.map((k) => `<th>Sem ${k + 1}</th>`).join('')}<th></th></tr></thead><tbody>
          <tr><td class="muted small" style="font-weight:700">${b.tipo === 'circuito' ? 'Vueltas' : b.tipo === 'amrap' ? 'Minutos' : 'Series'}</td>${wk.map((k) => `<td><input data-b="${bi}" data-k="series" data-w="${k}" value="${esc(b.series[k])}" aria-label="Series semana ${k + 1}" style="${cell}"></td>`).join('')}<td></td></tr>
          ${b.items.map((it, ii) => `<tr><td><input list="ej-list" data-b="${bi}" data-i="${ii}" data-k="nombre" value="${esc(it.nombre)}" placeholder="Nombre del ejercicio" aria-label="Ejercicio" style="${cell};font-weight:700"></td>
            ${wk.map((k) => `<td><input data-b="${bi}" data-i="${ii}" data-k="reps" data-w="${k}" value="${esc(it.reps[k])}" placeholder="reps" aria-label="Reps semana ${k + 1}" style="${cell}"><span class="row" style="gap:4px;margin-top:4px;flex-wrap:nowrap;color:var(--accent);font-weight:700;font-size:12px"><input data-b="${bi}" data-i="${ii}" data-k="pct" data-w="${k}" value="${esc(it.pct[k])}" placeholder="—" aria-label="Porcentaje semana ${k + 1}" style="${cell};width:70px;color:#ff8a8a;text-align:center">%</span></td>`).join('')}
            <td><button class="linkbtn" data-deli="${bi}:${ii}" aria-label="Quitar ejercicio">✕</button></td></tr>`).join('')}
        </tbody></table></div>
        <button class="linkbtn red" data-addi="${bi}">+ Agregar ejercicio</button></article>`).join('')}
      <button class="btn ghost" id="ed-addb" style="border-style:dashed">+ Agregar bloque al día ${ed.dia + 1}</button>
      <div class="msg err" id="err" hidden></div>`);
    // edición sin redibujar (para no perder el foco)
    document.querySelectorAll('[data-f]').forEach((el) => el.onchange = el.oninput = (e) => {
      const f = el.dataset.f;
      if (f === 'semanas' || f === 'dias') { if (e.type !== 'change') return; ed[f] = Number(el.value); resize(); return draw(); }
      ed[f] = el.value; save();
    });
    document.querySelectorAll('[data-k]').forEach((el) => el.oninput = () => {
      const b = ed.bloques[Number(el.dataset.b)], k = el.dataset.k, w = el.dataset.w != null ? Number(el.dataset.w) : null;
      if (el.dataset.i != null) { const it = b.items[Number(el.dataset.i)]; if (w == null) it[k] = el.value; else it[k][w] = el.value; }
      else if (w == null) b[k] = el.value; else b[k][w] = el.value;
      save();
    });
    document.querySelectorAll('[data-gid]').forEach((x) => x.onclick = () => { ed.gid = Number(x.dataset.gid); if (/^Plan de /.test(ed.nombre)) ed.nombre = 'Plan de ' + grupoName(ed.gid); LS.set('pf-grupo', ed.gid); draw(); });
    document.querySelectorAll('[data-day]').forEach((x) => x.onclick = () => { ed.dia = Number(x.dataset.day); draw(); });
    document.querySelectorAll('[data-bt]').forEach((x) => x.onclick = () => { ed.bloques[Number(x.dataset.bt)].tipo = x.dataset.v; draw(); });
    document.querySelectorAll('[data-delb]').forEach((x) => x.onclick = () => { ed.bloques.splice(Number(x.dataset.delb), 1); draw(); });
    document.querySelectorAll('[data-addi]').forEach((x) => x.onclick = () => { ed.bloques[Number(x.dataset.addi)].items.push(newItem(ed.semanas)); draw(); });
    document.querySelectorAll('[data-deli]').forEach((x) => x.onclick = () => { const [bi, ii] = x.dataset.deli.split(':').map(Number); ed.bloques[bi].items.splice(ii, 1); draw(); });
    $('#ed-addb').onclick = () => { const n = ed.bloques.filter((b) => b.dia === ed.dia + 1).length + 1; ed.bloques.push(newBlock(ed.dia + 1, n, ed.semanas)); draw(); };
    $('#ed-copy').onclick = () => { ed.bloques.filter((b) => b.dia === ed.dia + 1).forEach((b) => { b.series = b.series.map(() => b.series[0]); b.items.forEach((i) => { i.reps = i.reps.map(() => i.reps[0]); i.pct = i.pct.map(() => i.pct[0]); }); }); toast('Copié la semana 1 en todas las semanas del día ' + (ed.dia + 1)); draw(); };
    $('#ed-prog').onclick = () => { ed.bloques.filter((b) => b.dia === ed.dia + 1).forEach((b) => b.items.forEach((i) => { const base = parseFloat(String(i.pct[0]).replace(',', '.')); if (!isNaN(base) && /^\s*\d+([.,]\d+)?\s*$/.test(i.pct[0])) i.pct = i.pct.map((_, k) => String(Math.min(95, base + 5 * k))); })); toast('Subí 5% por semana desde la semana 1 (hasta 95%)'); draw(); };
    $('#ed-reset').onclick = (e) => { const b = e.currentTarget; if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Tocá de nuevo para borrar todo'; return; } ed = emptyEditor(ed.gid); draw(); };
    $('#ed-publish').onclick = publish;
  };
  async function publish() {
    const rows = editorToRows(ed);
    if (!rows.length) return showErr('La rutina no tiene ejercicios. Escribí al menos uno.');
    const btn = $('#ed-publish'); btn.disabled = true; btn.textContent = 'Publicando…';
    try {
      const { data: plan, error: e1 } = await db.from('planes').insert({ grupo_id: ed.gid, nombre: ed.nombre.trim() || 'Plan de ' + grupoName(ed.gid), inicio: ed.inicio || null, semanas: ed.semanas, dias: ed.dias, estado: 'borrador', origen: 'app', creado_por: S.user.id }).select().single();
      if (e1) throw e1;
      const order = {};
      const { data: bl, error: e2 } = await db.from('bloques').insert(rows.map((r) => ({ plan_id: plan.id, dia: r.dia, orden: (order[r.dia] = (order[r.dia] ?? -1) + 1), titulo: r.titulo, tipo: r.tipo, semanas: r.semanas }))).select();
      if (e2) throw e2;
      const items = [];
      const used = {};
      rows.forEach((r) => { const o = (used[r.dia] = (used[r.dia] ?? -1) + 1); const blk = bl.find((x) => x.dia === r.dia && x.orden === o); r.items.forEach((it, ii) => items.push({ bloque_id: blk.id, orden: ii, nombre: it.nombre, semanas: it.semanas })); });
      const { error: e3 } = await db.from('items').insert(items);
      if (e3) throw e3;
      const old = D.planes.filter((x) => x.grupo_id === ed.gid && x.estado === 'activo');
      if (old.length) { const { error } = await db.from('planes').update({ estado: 'archivado' }).in('id', old.map((o) => o.id)); if (error) throw error; }
      const { error: e4 } = await db.from('planes').update({ estado: 'activo' }).eq('id', plan.id);
      if (e4) throw e4;
      LS.set('editor-v1', null); S.plan = null;
      toast('Rutina publicada para ' + grupoName(ed.gid) + ' ✓'); go('pf-rutinas');
    } catch (e) { btn.disabled = false; btn.textContent = 'Publicar para ' + grupoName(ed.gid); fail(e); }
  }
  draw();
}

async function pfComentarios(D) {
  const roots = D.comentarios.filter((c) => !c.respuesta_a && c.autor_id === c.jugador_id);
  const itemIds = [...new Set(roots.map((c) => c.item_id).filter(Boolean))];
  const { data: its } = itemIds.length ? await db.from('items').select('id,nombre').in('id', itemIds) : { data: [] };
  const itemName = Object.fromEntries((its || []).map((i) => [i.id, i.nombre]));
  const sesById = Object.fromEntries(D.sesiones.map((s) => [s.id, s]));
  pfShell('pf-comentarios', `<div class="row between" style="align-items:flex-end"><h1 class="h1">Comentarios</h1><span class="small" style="color:var(--accent);font-weight:800">${D.pending.length} sin responder</span></div>
    ${roots.length ? roots.map((c) => {
      const p = D.byId[c.jugador_id], s = sesById[c.sesion_id];
      const reps = D.comentarios.filter((r) => r.respuesta_a === c.id).reverse();
      const pending = D.pending.includes(c);
      return `<article class="panel" style="${pending ? 'border-color:var(--accent)' : ''}"><div class="row between"><b>${esc(p?.nombre || 'Jugador')}</b><span class="small muted">${fmtDate(c.creado_en)}</span></div>
        <p class="small muted" style="margin:2px 0 0">${esc(grupoName(p?.grupo_id))}${s ? ` · Semana ${s.semana}, Día ${s.dia}` : ''}${c.item_id ? ' · ' + esc(itemName[c.item_id] || '') : ''}</p>
        <p style="margin:8px 0 0">“${esc(c.texto)}”</p>
        <div class="chat">${reps.map((r) => `<div class="bubble pf"><small>${esc(D.byId[r.autor_id]?.nombre || 'PF')} · ${fmtDate(r.creado_en)}</small>${esc(r.texto)}</div>`).join('')}</div>
        <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="input" data-reply-in="${c.id}" placeholder="Escribile una respuesta" aria-label="Respuesta para ${esc(p?.nombre || 'el jugador')}" style="min-height:42px"><button class="btn small" data-reply="${c.id}" data-j="${c.jugador_id}">Responder</button></div>
        ${pending ? `<button class="linkbtn" data-read="${c.id}">Marcar como visto</button>` : ''}</article>`;
    }).join('') : '<p class="muted">Todavía no hay comentarios de jugadores.</p>'}`);
  document.querySelectorAll('[data-reply]').forEach((b) => b.onclick = async () => {
    const inp = document.querySelector(`[data-reply-in="${b.dataset.reply}"]`), txt = inp.value.trim(); if (!txt) return;
    const { error } = await db.from('comentarios').insert({ jugador_id: b.dataset.j, autor_id: S.user.id, respuesta_a: Number(b.dataset.reply), texto: txt });
    if (error) return fail(error);
    await db.from('comentarios').update({ leido: true }).eq('id', Number(b.dataset.reply));
    toast('Respuesta enviada'); renderPF('pf-comentarios');
  });
  document.querySelectorAll('[data-read]').forEach((b) => b.onclick = async () => { const { error } = await db.from('comentarios').update({ leido: true }).eq('id', Number(b.dataset.read)); if (error) return fail(error); renderPF('pf-comentarios'); });
}

boot().catch(fail);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- Aviso de versión nueva ----------
// Cada vez que se publica un cambio: subir APP_VERSION acá y el mismo número en version.json
// (primero este archivo, después version.json).
const APP_VERSION = 4;
async function checkVersion() {
  if (!navigator.onLine || document.querySelector('.overlay.update')) return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { version } = await r.json();
    if (Number(version) > APP_VERSION) showUpdate();
  } catch {}
}
function showUpdate() {
  const o = document.createElement('div');
  o.className = 'overlay update';
  o.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="up-title" aria-describedby="up-text" style="text-align:center">
    <div style="font-size:46px;line-height:1" aria-hidden="true">🔄</div>
    <h2 id="up-title">Hay una<br>versión nueva</h2>
    <p class="muted" id="up-text">Actualizá la app para seguir. Lo que ya marcaste queda guardado.</p>
    <button class="btn" id="up-btn">Actualizar ahora</button></div>`;
  document.body.appendChild(o);
  const btn = o.querySelector('#up-btn');
  btn.focus();
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Actualizando…';
    try { await flush(); } catch {}
    try { const regs = await navigator.serviceWorker?.getRegistrations() || []; await Promise.all(regs.map((g) => g.update())); } catch {}
    try { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } catch {}
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  };
}
setTimeout(checkVersion, 2000);
setInterval(checkVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
window.addEventListener('online', checkVersion);
